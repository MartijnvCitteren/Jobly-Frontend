version: '3.8'

services:
  # ================================
  # Jobly Frontend - Local Development
  # ================================
  frontend-local:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    container_name: jobly-frontend-local
    ports:
      - "3000:3000"
    environment:
      - API_BASE_URL=http://localhost:8090
      - ENVIRONMENT=local
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - jobly-network

  # ================================
  # Jobly Frontend - Dev Environment
  # ================================
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    container_name: jobly-frontend-dev
    ports:
      - "3001:3000"
    environment:
      - API_BASE_URL=https://api-dev.jobzy.app
      - ENVIRONMENT=dev
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - jobly-network
    profiles:
      - dev

  # ================================
  # Jobly Frontend - Production Simulation
  # ================================
  frontend-prod:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    container_name: jobly-frontend-prod
    ports:
      - "3002:3000"
    environment:
      - API_BASE_URL=https://api.jobzy.app
      - ENVIRONMENT=prod
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - jobly-network
    profiles:
      - prod

networks:
  jobly-network:
    driver: bridge
